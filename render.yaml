services:
  # --- 1. CONFIGURACIÓN DEL BACKEND (Django) ---
  - type: web
    name: proa-conecta-backend
    env: python
    region: ohio # Puedes cambiarlo a la región que prefieras
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python proa/manage.py migrate --noinput
    startCommand: gunicorn proa.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: KEY_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Lo completarás en el panel de Render
      - key: DATABASE_URL_MONGODB
        sync: false # Lo completarás en el panel de Render
      - key: DISCORD_WEBHOOK_URL
        sync: false

  # --- 2. CONFIGURACIÓN DEL FRONTEND (Angular) ---
  - type: static
    name: proa-conecta-frontend
    env: static
    region: ohio
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build -- --configuration production
    staticPublishPath: ./dist/frontend/browser # Ajusta esta ruta si tu build de Angular genera los archivos estáticos en otra carpeta (ej: dist/proa-conecta/browser)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
[pytest]
DJANGO_SETTINGS_MODULE = proa.settings_test
python_files = test_*.py
testpaths = usuario academico aula_virtual notificacion foro
asyncio_mode = auto
# Las migraciones todavía no están versionadas (backend/.gitignore las ignora),
# así que la base de pruebas se arma desde los modelos. Quitar al versionarlas.
addopts = --nomigrations -p no:cacheprovider

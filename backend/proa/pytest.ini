[pytest]
DJANGO_SETTINGS_MODULE = proa.settings_test
python_files = test_*.py
testpaths = core usuario academico aula_virtual notificacion foro integraciones
asyncio_mode = auto
# Las migraciones ya están versionadas: la base de pruebas se arma ejecutándolas
# (incluidos los roles iniciales), así los tests ejercitan el esquema real.
addopts = -p no:cacheprovider

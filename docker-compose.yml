services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: django_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=1
    command: python manage.py runserver 0.0.0.0:8000 
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - "**/__pycache__/**"
            - "**/*.pyc"
            
        - action: rebuild
          path: ./backend/requirements.txt

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: angular_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
    develop:
      watch:
        
        - action: rebuild
          path: ./frontend/src
        
        - action: rebuild
          path: ./frontend/package.json
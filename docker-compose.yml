# Compartido por backend y programador: misma imagen y mismo entorno
x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-backend-entorno: &backend-entorno
  # Settings por entorno. Un despliegue real usa proa.settings.prod (DEBUG apagado, clave y hosts obligatorios)
  - DJANGO_SETTINGS_MODULE=proa.settings.dev
  - DJANGO_DEBUG=True
  # ATENCIÓN: este compose es solo para desarrollo local (proa.settings.dev). La clave de abajo es
  # un valor de desarrollo, público en el repositorio: un despliegue de staging o producción debe
  # definir su propia DJANGO_SECRET_KEY y nunca reutilizar este archivo tal cual. Con
  # proa.settings.prod esta clave es rechazada y la app no arranca.
  - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-clave-de-desarrollo-del-compose-local-no-usar-en-produccion}
  - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,backend
  - DJANGO_CORS_ALLOWED_ORIGINS=http://localhost:4200,http://127.0.0.1:4200
  - DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:4200,http://127.0.0.1:4200
  - PYTHONUNBUFFERED=1
  - DATABASE_URL=postgres://proa:${POSTGRES_PASSWORD:-proa}@db:5432/proa
  - DB_SSL=False
  - DATABASE_URL_MONGODB=mongodb://mongo:27017
  - REDIS_URL=redis://redis:6379/0

services:
  # PostgreSQL local (datos relacionales)
  db:
    image: postgres:17-alpine
    container_name: proa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: proa
      POSTGRES_USER: proa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proa -d proa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MongoDB local (notificaciones, mensajes, bitácora)
  mongo:
    image: mongo:7
    container_name: proa_mongo
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Redis (capa de canales de WebSocket)
  redis:
    image: redis:7-alpine
    container_name: proa_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: *backend-build
    image: proa-backend:local
    container_name: django_backend
    # Sin restart: si falla migrate el backend queda detenido y el error se ve en los logs
    volumes:
      - ./backend:/app
      # Archivos subidos (MEDIA_ROOT = /app/proa/media); el volumen sobrevive a recrear el contenedor
      - mediadata:/app/proa/media
    ports:
      # Solo desarrollo local: el frontend con ng serve (:4200) llama a la API en http://127.0.0.1:8000.
      # En producción no se publica: el backend queda detrás de nginx (confía en X-Forwarded-Proto)
      - "8000:8000"
    # Si backend/.env no existe el stack igual levanta (ver backend/.env.example)
    env_file:
      - path: ./backend/.env
        required: false
    # Lo definido acá pisa lo de backend/.env: apunta a los contenedores locales
    environment: *backend-entorno
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && uvicorn proa.asgi:application --host 0.0.0.0 --port 8000"
    # La imagen no trae curl: se usa python. urlopen lanza error con 4xx/5xx, así que un 503 (PostgreSQL caído) falla
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s
    develop:
      watch:
        # Requiere Docker Compose >= 2.23 para sync+restart; el hot reload se reemplazó por un reinicio en cada cambio
        - action: sync+restart
          path: ./backend
          target: /app
          ignore:
            - "**/__pycache__/**"
            - "**/*.pyc"

        - action: rebuild
          path: ./backend/requirements.txt

  # Publica en vivo los avisos programados cuando llega su fecha (publicar_notificaciones_programadas).
  # Si está caído, los avisos igual aparecen al recargar (la lectura filtra por fecha); solo se demora el push en vivo
  programador:
    build: *backend-build
    image: proa-backend:local
    # Sin container_name ni puertos: no se conecta nadie a este servicio
    restart: unless-stopped
    volumes:
      - ./backend:/app
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-entorno
    depends_on:
      backend:
        condition: service_healthy
    # Una vuelta fallida se registra y la siguiente corre igual
    command: >
      sh -c 'while true; do
      python manage.py publicar_notificaciones_programadas
      || echo "Falló una vuelta del programador; se reintenta en 60 s";
      sleep 60; done'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: angular_frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:

        - action: rebuild
          path: ./frontend/src

        - action: rebuild
          path: ./frontend/package.json

volumes:
  pgdata:
  mongodata:
  mediadata:

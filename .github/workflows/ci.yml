name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Solo se cancelan corridas de pull requests; un push a develop nunca se interrumpe
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/proa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r ../requirements-dev.txt
      # settings_test usa SQLite en memoria y no necesita .env ni servicios externos
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run --settings=proa.settings_test
      - name: Tests con cobertura
        run: pytest --cov --cov-report=term-missing

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npx ng build --configuration production
      # Obligatorio: sin continue-on-error. Falla ante cualquier error de ESLint (los warnings no bloquean)
      - name: Lint del frontend
        run: npm run lint
      # Obligatorio: sin continue-on-error. Vitest sobre jsdom, sin navegador ni modo watch
      - name: Tests del frontend
        run: npx ng test --watch=false

  secretos:
    name: secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Se usa el binario de gitleaks y no gitleaks-action: la acción exige GITLEAKS_LICENSE
      # en repositorios de organizaciones. La versión queda fijada y se verifica el checksum.
      - name: Buscar secretos en el historial del pull request
        env:
          GITLEAKS_VERSION: 8.28.0
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # El archivo conserva su nombre original para que sha256sum -c lo encuentre
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${archivo}" -o "${archivo}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${archivo}$" checksums.txt | sha256sum -c -
          tar -xzf "${archivo}" gitleaks
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${GITHUB_SHA}"
          else
            # Rama nueva (before en ceros) o force-push (before inalcanzable): se compara con develop
            range="origin/develop..HEAD"
          fi
          ./gitleaks git --redact --verbose --config .gitleaks.toml --log-opts="${range}" .

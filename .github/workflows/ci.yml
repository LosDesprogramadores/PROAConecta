name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Solo se cancelan corridas de pull requests; un push a develop nunca se interrumpe
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/proa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r ../requirements-dev.txt
      # settings.test usa SQLite en memoria y no necesita .env ni servicios externos
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run --settings=proa.settings.test
      # Clave generada en cada corrida y sin secretos de GitHub. HSTS y redirect a https se activan solo en este
      # paso (por defecto quedan apagados para el compose local); por ahora solo se falla ante errores (quedan advertencias de drf-spectacular y W021)
      - name: Check de despliegue (settings.prod)
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(50))')" \
          DJANGO_ALLOWED_HOSTS=ejemplo.com \
          DJANGO_SECURE_HSTS_SECONDS=31536000 \
          DJANGO_SECURE_SSL_REDIRECT=true \
          python manage.py check --deploy --settings=proa.settings.prod --fail-level ERROR
      - name: Tests con cobertura
        run: pytest --cov --cov-report=term-missing

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npx ng build --configuration production
      # Obligatorio: sin continue-on-error. Falla ante cualquier error de ESLint (los warnings no bloquean)
      - name: Lint del frontend
        run: npm run lint
      # Obligatorio: sin continue-on-error. Vitest sobre jsdom, sin navegador ni modo watch
      - name: Tests del frontend
        run: npx ng test --watch=false

  # Recorridos críticos en un navegador real sobre el compose (docker-compose.e2e.yml: proyecto propio, Mailpit para
  # el correo, datos de seed_demo). Solo en pull requests; si falla, el pull request no se puede fusionar.
  e2e:
    name: e2e
    if: github.event_name == 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -p proa-e2e -f docker-compose.yml -f docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # Sin secretos: las variables del stack son valores de prueba escritos en docker-compose.e2e.yml
      - name: Levantar el stack E2E
        run: ${COMPOSE} up -d --build --wait --wait-timeout 300
      - name: Instalar dependencias de e2e
        working-directory: e2e
        run: npm ci
      - name: Instalar Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      # Obligatorio: sin continue-on-error
      - name: Ejecutar los tests E2E
        working-directory: e2e
        run: npx playwright test
      - name: Subir reporte y trazas
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-reporte
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Registros del stack
        if: failure()
        run: ${COMPOSE} logs --no-color --tail 200
      - name: Bajar el stack
        if: always()
        run: ${COMPOSE} down -v

  secretos:
    name: secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Se usa el binario de gitleaks y no gitleaks-action: la acción exige GITLEAKS_LICENSE
      # en repositorios de organizaciones. La versión queda fijada y se verifica el checksum.
      - name: Buscar secretos en el historial del pull request
        env:
          GITLEAKS_VERSION: 8.28.0
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # El archivo conserva su nombre original para que sha256sum -c lo encuentre
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${archivo}" -o "${archivo}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${archivo}$" checksums.txt | sha256sum -c -
          tar -xzf "${archivo}" gitleaks
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${GITHUB_SHA}"
          else
            # Rama nueva (before en ceros) o force-push (before inalcanzable): se compara con develop
            range="origin/develop..HEAD"
          fi
          ./gitleaks git --redact --verbose --config .gitleaks.toml --log-opts="${range}" .

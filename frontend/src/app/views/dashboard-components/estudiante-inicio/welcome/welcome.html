<section class="max-w-7xl mx-auto p-6 space-y-4">
  <!-- Header de Bienvenida Personalizado -->
  <header class="border-b border-slate-200 pb-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">¡Hola, {{userName()}}! 👋</h2>
      <p class="text-sm text-slate-500">Aquí tienes el resumen de tu actividad académica.</p>
    </div>
  </header>

  <div>
    <app-informacion class="hidden lg:block"></app-informacion>
  </div>

  <!-- Grilla Principal en 3 Columnas de igual tamaño -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">

    <!-- 1. Columna Izquierda: Materias -->
    <div class="space-y-4">
      <app-materias-resumen></app-materias-resumen>
    </div>

    <!-- 2. Columna Central: Última novedad (Componente Encapsulado) -->
    <div class="space-y-4">
      <app-anuncios></app-anuncios>
    </div>

    <!-- 3. Columna Derecha: Próximas Entregas -->
    <div class="space-y-4">
      <app-proximas-entregas></app-proximas-entregas>
    </div>

  </div>
</section>

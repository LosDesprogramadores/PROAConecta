<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

    <div class="bg-white p-4 rounded-xl border border-slate-200 flex items-center gap-4">
        <div
            class="w-12 h-12 rounded-lg bg-blue-50 text-primary flex items-center justify-center font-bold text-lg shrink-0">
            📚
        </div>
        <div>
            <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Materias</span>

            @if (cargando()) {
            <div class="flex items-center gap-2 mt-1">
                <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-primary"></div>
                <span class="text-xs text-slate-400">Cargando...</span>
            </div>
            } @else {
            <p class="text-xl font-bold text-slate-800">{{ materias() }} Activas</p>
            }
        </div>
    </div>

    <div class="bg-white p-4 rounded-xl border border-slate-200 flex items-center gap-4">
        <div
            class="w-12 h-12 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center font-bold text-lg shrink-0">
            📝
        </div>
        <div>
            <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Actividades</span>
            <p class="text-xl font-bold text-slate-800">2 Pendientes</p>
        </div>
    </div>

    <!-- KPI Avisos -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 flex items-center gap-4">
        <div
            class="w-12 h-12 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold text-lg shrink-0">
            🔔
        </div>
        <div>
            <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Avisos</span>
            <p class="text-xl font-bold text-slate-800">2 Recientes</p>
        </div>
    </div>

</div>

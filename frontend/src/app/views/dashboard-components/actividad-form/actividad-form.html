<section class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">

  <!-- HEADER -->
  <header class="flex items-center justify-between">
    <div>
      <p class="text-sm text-slate-500 mb-1">Gestión académica</p>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">
        {{ isEdicion() ? 'Editar Actividad' : 'Nueva Actividad' }}
      </h1>
    </div>
    <button
      (click)="volver()"
      class="px-4 py-2 border border-slate-200 text-slate-700 rounded-xl text-sm font-semibold hover:bg-slate-50 transition">
      ← Volver
    </button>
  </header>

  <!-- ERROR -->
  @if (error()) {
    <div class="bg-red-50 border border-red-200 rounded-xl p-4 text-red-700">
      ⚠️ {{ error() }}
    </div>
  }

  <!-- FORMULARIO -->
  <form [formGroup]="form" (ngSubmit)="guardar()" class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-5">

    <!-- TÍTULO -->
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">Título de la actividad *</label>
      <input
        type="text"
        formControlName="titulo"
        placeholder="Ej: Templo de bases de datos o Práctica Unidad 1"
        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm" />
      @if (form.get('titulo')?.invalid && form.get('titulo')?.touched) {
        <p class="text-xs text-red-600 mt-1">El título es obligatorio.</p>
      }
    </div>

    <!-- MATERIA ID (Oculto o visible según prefieras, acá lo dejamos como input numérico o selector) -->
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">ID de Materia *</label>
      <input
        type="number"
        formControlName="materia"
        placeholder="ID de la materia"
        class="w-full sm:w-1/2 px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary text-sm" />
      <p class="text-xs text-slate-400 mt-1">Se completa automáticamente si accediste desde una materia.</p>
    </div>

    <!-- DESCRIPCIÓN -->
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">Descripción / Consignas</label>
      <textarea
        rows="4"
        formControlName="descripcion"
        placeholder="Describí los detalles de la tarea..."
        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm"></textarea>
    </div>

    <!-- FECHA LÍMITE Y ESTADO -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Fecha y hora límite *</label>
        <input
          type="datetime-local"
          formControlName="fecha_limite"
          class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm" />
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Estado</label>
        <select
          formControlName="estado"
          class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm bg-white">
          <option value="PUBLICADA">Publicada</option>
          <option value="BORRADOR">Borrador</option>
        </select>
      </div>
    </div>

    <!-- ENLACE EXTERNO -->
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-1">Enlace de referencia (Opcional)</label>
      <input
        type="url"
        formControlName="enlace"
        placeholder="https://..."
        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm" />
    </div>

    <!-- CHECKBOX PERMITIR TARDÍA -->
    <div class="flex items-center gap-2 pt-2">
      <input
        type="checkbox"
        id="entregaTardia"
        formControlName="permitir_entrega_tardia"
        class="w-4 h-4 text-primary rounded border-slate-300 focus:ring-primary" />
      <label for="entregaTardia" class="text-sm text-slate-700 font-medium cursor-pointer">
        Permitir entregas fuera de término (tardías)
      </label>
    </div>

    <!-- BOTONES DE ACCIÓN -->
    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
      <button
        type="button"
        (click)="volver()"
        class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-semibold text-sm hover:bg-slate-50 transition">
        Cancelar
      </button>

      <button
        type="submit"
        [disabled]="cargando()"
        class="px-5 py-2.5 rounded-xl bg-primary text-white font-semibold text-sm hover:bg-primary/90 transition shadow-sm disabled:opacity-50">
        {{ cargando() ? 'Guardando...' : (isEdicion() ? 'Actualizar Actividad' : 'Crear Actividad') }}
      </button>
    </div>

  </form>

</section>

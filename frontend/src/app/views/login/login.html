<section class="w-full px-6 sm:px-12 py-12 bg-surface min-h-screen flex flex-col items-center justify-center">
    <div class="flex flex-col items-center justify-center w-full max-w-md mx-auto">


        <a routerLink="/" class="flex items-center gap-3 mb-8 group focus:outline-none">
            <div
                class="flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-700 to-blue-900 shadow-md text-white font-black text-2xl transition-transform duration-300 group-hover:scale-105">
                P
            </div>
            <span class="text-2xl font-bold tracking-tight text-slate-800 transition-colors duration-200">
                PROA<span class="text-sky-600">Conecta</span>
            </span>
        </a>


        <div class="w-full bg-white rounded-2xl shadow-xl border border-slate-200/80 p-8 transition-all">
            <div class="space-y-6">

                <div class="text-center sm:text-left">
                    <h1 class="text-2xl font-bold tracking-tight text-slate-900">
                        Iniciar sesión
                    </h1>
                    <p class="text-sm text-slate-500 mt-1">
                        Ingresá tus datos para acceder a la plataforma.
                    </p>
                </div>

                <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-5">
                    <div>
                        <label for="dni" class="block mb-2 text-sm font-semibold text-slate-700">Tu DNI</label>
                        <input type="text" id="dni" formControlName="dni"
                            class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500 block w-full p-3 transition-all outline-none"
                            placeholder="DNI">
                    </div>

                    <div>
                        <label for="password" class="block mb-2 text-sm font-semibold text-slate-700">Contraseña</label>
                        <input type="password" id="password" formControlName="password" placeholder="••••••••"
                            class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500 block w-full p-3 transition-all outline-none">
                    </div>

                    <div class="flex items-center justify-between text-sm">
                        <div class="flex items-center">
                            <input id="remember" aria-describedby="remember" type="checkbox"
                                class="w-4 h-4 border border-slate-300 rounded bg-slate-50 text-sky-600 focus:ring-sky-500">
                            <label for="remember" class="ml-2 text-slate-600 font-medium">Recordarme</label>
                        </div>
                        <a href="#" class="font-medium text-sky-600 hover:text-sky-700 hover:underline">¿Olvidaste tu
                            contraseña?</a>
                    </div>

                    <button type="submit"
                        class="w-full text-white bg-sky-600 hover:bg-sky-700 focus:ring-4 focus:outline-none focus:ring-sky-300 font-semibold rounded-xl text-sm px-5 py-3 text-center shadow-md transition-all">
                        Ingresar
                    </button>
                </form>


                <div class="pt-4 border-t border-slate-100 text-center">
                    <a routerLink="/"
                        class="inline-flex items-center gap-2 text-sm font-medium text-slate-600 hover:text-sky-700 transition-colors">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                        </svg>
                        Volver al inicio
                    </a>
                </div>

            </div>
        </div>
    </div>
</section>

<div class="max-w-4xl mx-auto px-4 sm:px-6 py-6">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Todas las Notificaciones</h1>
      <p class="text-sm text-slate-500">Revisa el historial completo de alertas y avisos del sistema.</p>
    </div>
    <button (click)="marcarTodasComoLeidas()" class="text-xs font-semibold text-sky-600 bg-sky-50 hover:bg-sky-100 px-3 py-2 rounded-xl transition">
      Marcar todas como leídas
    </button>
  </div>

  <div class="space-y-3">
    @for (notif of notificaciones(); track notif.id) {
      <div [class.bg-sky-50/40]="!notif.leida" [class.bg-white]="notif.leida" 
           class="p-4 rounded-2xl border border-slate-200 shadow-sm flex items-start justify-between gap-4 transition hover:shadow-md">
        
        <div class="flex items-start gap-3">
          <div class="bg-sky-100 text-sky-700 p-2.5 rounded-xl shrink-0 mt-0.5">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h3 class="text-sm font-bold text-slate-800">{{ notif.titulo }}</h3>
              @if (!notif.leida) {
                <span class="h-2 w-2 rounded-full bg-sky-600"></span>
              }
            </div>
            <p class="text-xs text-slate-600 mt-1">{{ notif.descripcion }}</p>
            <span class="inline-block mt-2 text-[10px] text-slate-400">{{ notif.tiempo }}</span>
          </div>
        </div>

        <button (click)="eliminarNotificacion(notif.id)" class="text-slate-400 hover:text-red-600 p-1 transition" title="Eliminar alerta">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>

      </div>
    } @empty {
      <div class="text-center py-12 bg-white rounded-2xl border border-slate-200">
        <p class="text-sm text-slate-500">No tienes notificaciones pendientes.</p>
      </div>
    }
  </div>
</div>

<main class="min-h-screen bg-[#eaf1f8] flex flex-col items-center justify-center p-4">
  <div class="flex items-center gap-3 mb-8">
    <div class="w-12 h-12 bg-[#0056b3] rounded-2xl flex items-center justify-center text-white font-bold text-2xl shadow-sm">
      P
    </div>
    <span class="text-2xl font-bold tracking-tight text-[#0f2b48]">
      PROA<span class="text-[#0084d6]">Conecta</span>
    </span>
  </div>

  <div class="w-full max-w-[430px] bg-white rounded-3xl shadow-xl shadow-slate-200/50 p-8 sm:p-10">
    <header class="mb-6">
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Restablecer Contraseña</h1>
      <p class="text-sm text-slate-500 mt-1">Ingresá tu nueva clave para volver a acceder.</p>
    </header>

    @if (mensajeExito()) {
      <div class="p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-center space-y-2">
        <p class="text-sm font-semibold text-emerald-800">{{ mensajeExito() }}</p>
      </div>
    } @else {
      @if (errorMessage()) {
        <div class="mb-5 p-3.5 bg-red-50 border border-red-200/70 rounded-xl text-xs text-red-700">
          {{ errorMessage() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label for="password_nuevo" class="block text-sm font-semibold text-slate-700 mb-1.5">Nueva Contraseña</label>
          <input
            id="password_nuevo"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password_nuevo"
            placeholder="Mínimo 8 caracteres"
            class="w-full bg-[#eef3fb] border border-[#d6e3f3] text-slate-800 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-sky-500"
          />
        </div>

        <div>
          <label for="confirmar_password" class="block text-sm font-semibold text-slate-700 mb-1.5">Confirmar Contraseña</label>
          <input
            id="confirmar_password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="confirmar_password"
            placeholder="Repetí tu nueva clave"
            class="w-full bg-[#eef3fb] border border-[#d6e3f3] text-slate-800 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-sky-500"
          />
        </div>

        <button
          type="submit"
          [disabled]="isLoading() || form.invalid || !uid() || !token()"
          class="w-full py-3 bg-[#0084d6] hover:bg-[#0074bd] text-white font-medium rounded-xl shadow-md transition disabled:opacity-50"
        >
          {{ isLoading() ? 'Guardando...' : 'Restablecer Contraseña' }}
        </button>
      </form>
    }

    <div class="pt-5 mt-4 border-t border-slate-100 text-center">
      <a routerLink="/login" class="text-sm text-slate-600 hover:text-slate-900 transition">
        ← Volver al inicio de sesión
      </a>
    </div>
  </div>
</main>

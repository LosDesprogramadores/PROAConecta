<div class="flex flex-col gap-5 p-6 min-h-screen text-slate-800 font-sans">
  
  <!-- Breadcrumb -->
  <nav class="flex items-center gap-2 text-sm text-slate-500">
    <span (click)="volverAlForo()" class="text-blue-600 cursor-pointer hover:underline">{{ materia() }}</span>
    <span>/</span>
    <span (click)="volverAlForo()" class="text-blue-600 cursor-pointer hover:underline">Foro</span>
    <span>/</span>
    <span class="text-slate-700 font-medium truncate max-w-xs md:max-w-md">{{ tituloTema() }}</span>
  </nav>

  <!-- Encabezado con ícono -->
  <header class="flex items-center gap-3">
    <div class="text-blue-600">
      <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">{{ tituloTema() }}</h1>
  </header>

  <!-- Barra de Orden y Configuración -->
  <div class="flex justify-between items-center pt-2">
    <select 
      [value]="ordenSeleccionado()" 
      (change)="ordenarPublicaciones($event)" 
      class="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm text-slate-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
      <option value="antiguo">Ordenar desde el más antiguo</option>
      <option value="reciente">Ordenar desde el más reciente</option>
    </select>

    <button type="button" class="bg-white border border-slate-300 hover:bg-slate-50 rounded-lg px-3 py-1.5 text-sm text-slate-700 shadow-sm flex items-center gap-1.5 cursor-pointer">
      Configuraciones
      <svg class="w-4 h-4 text-slate-500" fill="currentColor" viewBox="0 0 24 24">
        <path d="M7 10l5 5 5-5z"/>
      </svg>
    </button>
  </div>

  <!-- Lista de publicaciones -->
  <div class="flex flex-col gap-4">
    @for (post of publicaciones(); track post.id) {
      <article 
        class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm transition-all"
        [ngClass]="{'ml-0 md:ml-6 border-l-4 border-l-blue-600': post.esRespuesta}">
        
        <!-- Header del post -->
        <div class="flex items-center gap-3 mb-3">
          <div class="w-10 h-10 rounded-full bg-blue-600 text-white font-semibold flex items-center justify-center shrink-0">
            {{ post.inicialesAutor }}
          </div>
          <div class="flex flex-col">
            <h3 class="font-semibold text-blue-700 text-base leading-snug">{{ post.autor }}</h3>
            <span class="text-xs text-slate-400 capitalize">{{ formatearFecha(post.fecha) }}</span>
          </div>
        </div>

        <!-- Contenido (whitespace-pre-line respeta los saltos de línea) -->
        <div class="text-slate-700 text-sm leading-relaxed mb-4 whitespace-pre-line">
          <p>{{ post.contenido }}</p>
        </div>

        <!-- Acciones -->
        <div class="flex justify-end gap-4 border-t border-slate-100 pt-3">
          <button type="button" class="text-xs font-medium text-blue-600 hover:underline bg-transparent border-0 cursor-pointer">
            Enlace permanente
          </button>
          <button 
            type="button"
            (click)="mostrandoFormulario.set(true)" 
            class="text-xs font-medium text-blue-600 hover:underline bg-transparent border-0 cursor-pointer">
            Responder
          </button>
        </div>
      </article>
    }
  </div>

  <!-- Formulario de Respuesta -->
  @if (mostrandoFormulario()) {
    <div class="bg-white rounded-xl p-5 border border-slate-300 shadow-md flex flex-col gap-3">
      <h3 class="font-semibold text-slate-800 text-sm">Escribir respuesta</h3>
      <textarea 
        [ngModel]="nuevaRespuesta()" 
        (ngModelChange)="nuevaRespuesta.set($event)"
        placeholder="Escribí tu respuesta..."
        rows="3"
        class="w-full border border-slate-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y">
      </textarea>
      <div class="flex justify-end gap-2">
        <button 
          type="button"
          (click)="mostrandoFormulario.set(false)" 
          class="px-4 py-2 text-xs font-medium bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 transition-colors cursor-pointer">
          Cancelar
        </button>
        <button 
          type="button"
          (click)="enviarRespuesta()" 
          class="px-4 py-2 text-xs font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-sm cursor-pointer">
          Publicar respuesta
        </button>
      </div>
    </div>
  }

  <!-- Navegación inferior entre temas -->
  <footer class="flex justify-between items-center pt-4 text-xs font-medium text-blue-600">
    <button type="button" class="hover:underline bg-transparent border-0 cursor-pointer">◄ Tema anterior</button>
    <button type="button" class="hover:underline bg-transparent border-0 cursor-pointer">Siguiente tema ►</button>
  </footer>

</div>

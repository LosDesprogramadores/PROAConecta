<section class="p-6 space-y-8">
    @let m = materia || materiaDemo;

    <!-- Nombre de la materia -->
    <h2 class="text-3xl font-bold text-primary">{{ m.nombre }}</h2>
    <p class="text-slate-600 text-lg">
        Docente a cargo: <span class="font-semibold">{{ m.docente }}</span>
    </p>

    <!-- Presentación -->
    <div class="rounded-xl bg-white shadow-md p-6 border border-slate-200">
        <h3 class="text-xl font-semibold text-slate-800 mb-4">Presentación</h3>
        <p class="text-slate-700">{{ m.presentacion }}</p>
    </div>

    <!-- Cronograma / Temario -->
    <div class="rounded-xl bg-white shadow-md p-6 border border-slate-200">
        <h3 class="text-xl font-semibold text-slate-800 mb-4">Cronograma / Temario</h3>
        <ul class="list-disc list-inside space-y-2 text-slate-700">
            @for (tema of m.cronograma; track tema) {
                <li>{{ tema }}</li>
            }
        </ul>
    </div>
</section>

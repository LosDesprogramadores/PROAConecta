<section class="max-w-7xl mx-auto p-6 space-y-6">

  <!-- HEADER -->
  <header
    class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
    <div class="flex items-center gap-4">
      <div
        class="w-14 h-14 rounded-xl bg-blue-50 text-primary flex items-center justify-center font-bold text-xl border border-blue-100 shrink-0">
        {{ datosActuales.nombre.charAt(0) }}
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600">
            Ciclo Lectivo {{ datosActuales.anio }}
          </span>
          <span class="text-xs font-medium text-slate-400">
            {{ datosActuales.curso }}
          </span>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 mt-1">
          {{ datosActuales.nombre }}
        </h1>
      </div>
    </div>

    <!-- FORO -->
    <a routerLink="/view-materia/foro"
      class="inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-primary text-primary hover:bg-primary hover:text-white transition text-sm font-semibold shadow-sm">
      <span>💬</span>
      <span>Ir al Foro</span>
    </a>
  </header>

  <!-- GRILLA -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- COLUMNA IZQUIERDA -->
    <main class="lg:col-span-2 space-y-6">
      <!-- PRESENTACIÓN (Solo lectura) -->
      <article class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-3">
        <h3 class="text-lg font-semibold text-slate-800">
          Sobre la materia
        </h3>
        <p class="text-sm text-slate-600 leading-relaxed">
          {{ datosActuales.presentacion }}
        </p>
      </article>

      <!-- PROGRAMA Y UNIDADES -->
      <app-unidades-material></app-unidades-material>
    </main>

    <!-- COLUMNA DERECHA -->
    <aside class="space-y-6">
      <!-- DOCENTE -->
      <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-4">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
          Equipo Docente
        </h3>
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-600 text-sm border border-slate-200">
            {{ datosActuales.docente.charAt(0) }}
          </div>
          <div class="min-w-0">
            <h4 class="text-sm font-semibold text-slate-800 truncate">
              {{ datosActuales.docente }}
            </h4>
            <p class="text-xs text-slate-400 truncate">
              Profesor Titular
            </p>
          </div>
        </div>
      </div>

      <!-- RECURSOS -->
      <app-recursos-clase [materiaId]="materiaId"></app-recursos-clase>
    </aside>

  </div>
</section>

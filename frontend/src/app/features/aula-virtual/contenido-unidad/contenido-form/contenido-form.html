    <div
      class="formulario-contenido bg-blue-50 p-6 rounded-lg border-2 border-blue-300 mt-6"
    >

      <h3 class="text-xl font-semibold mb-4 text-slate-800">

        {{ contenido() ? '✏️ Editar Contenido' : '➕ Nuevo Contenido' }}

      </h3>


      <form
        [formGroup]="formulario"
        (ngSubmit)="enviar()"
        class="space-y-4"
      >


        <!-- TIPO -->

        <div>

          <label for="contenido-tipo" class="block text-sm font-medium text-slate-700 mb-2">
            Tipo de Contenido
          </label>

          <select
            id="contenido-tipo"
            formControlName="tipo"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
          >

            <option value="documento">
              📄 Documento (Google Drive, PDF online)
            </option>

            <option value="video">
              🎥 Video (YouTube, Vimeo)
            </option>

            <option value="enlace">
              🔗 Enlace (sitio web, recurso online)
            </option>

          </select>

        </div>


        <!-- TÍTULO -->

        <div>

          <label for="contenido-titulo" class="block text-sm font-medium text-slate-700 mb-2">
            Título *
          </label>

          <input
            id="contenido-titulo"
            type="text"
            formControlName="titulo"
            placeholder="Ej: Introducción a números reales"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />

        </div>


        <!-- DESCRIPCIÓN -->

        <div>

          <label for="contenido-descripcion" class="block text-sm font-medium text-slate-700 mb-2">
            Descripción
          </label>

          <textarea
            id="contenido-descripcion"
            formControlName="descripcion"
            placeholder="Describe brevemente el contenido..."
            rows="2"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          ></textarea>

        </div>


        <!-- URL -->

        <div>

          <label for="contenido-url" class="block text-sm font-medium text-slate-700 mb-2">
            URL del contenido *
          </label>

          <input
            id="contenido-url"
            type="url"
            formControlName="url"
            placeholder="https://drive.google.com/... o https://youtube.com/..."
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />

          <p class="text-xs text-gray-600 mt-1">
            💡 Pega aquí el link compartible del contenido.
          </p>

        </div>


        <!-- VISIBILIDAD -->

        <div class="bg-white p-4 rounded-lg border border-blue-200">

          <label class="flex items-center gap-3 cursor-pointer">

            <input
              type="checkbox"
              formControlName="visible"
              class="w-4 h-4"
            />

            <div>

              <span class="text-sm font-medium text-slate-700">
                Mostrar contenido a los alumnos
              </span>

              <p class="text-xs text-gray-500 mt-1">
                Si está desmarcado, solamente será visible para el profesor.
              </p>

            </div>

          </label>

        </div>


        <!-- AYUDA -->

        <div class="bg-blue-100 p-3 rounded-lg text-sm text-blue-800">

          <p class="font-semibold mb-1">
            {{ tituloAyuda() }}
          </p>

          <ul class="list-disc list-inside space-y-1 text-xs">

            @for (ayuda of pasosAyuda(); track ayuda) {

              <li>
                {{ ayuda }}
              </li>

            }

          </ul>

        </div>


        <!-- BOTONES -->

        <div class="flex gap-3 justify-end pt-4 border-t border-blue-200">

          <button
            type="button"
            (click)="cancelar.emit()"
            class="px-4 py-2 bg-gray-300 text-gray-800 rounded-lg hover:bg-gray-400 transition-colors font-medium"
          >
            Cancelar
          </button>

          <button
            type="submit"
            class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors font-medium"
          >
            {{ contenido() ? 'Actualizar' : 'Guardar' }}
          </button>

        </div>

      </form>

    </div>

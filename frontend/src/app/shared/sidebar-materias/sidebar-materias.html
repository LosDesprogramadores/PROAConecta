<aside
    class="w-58 m-5 rounded-2xl bg-gradient-to-b from-slate-200/90 to-slate-300/80 backdrop-blur-md shadow-md border border-white/40 transition-all duration-300">

    <!-- Botón volver con ícono -->
    <div class="p-6 text-xl font-bold text-primary">
        <a [routerLink]="'/dashboard/welcome'" routerLinkActive="text-sky-700 font-semibold"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex items-center gap-2 transition-colors rounded-lg hover:text-sky-700 hover:bg-light transition">
            <!-- Flecha hacia atrás -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            <span>Volver</span>
        </a>
    </div>

    <!-- Links dinámicos -->
    <nav class="flex-1 px-4 space-y-2">
        @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="bg-primary text-white font-semibold"
            class="block px-3 py-2 rounded-lg text-slate-700 hover:bg-light transition">
            {{ link.label }}
        </a>
        }
    </nav>
</aside>

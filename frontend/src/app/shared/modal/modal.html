<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm"
  (click)="alClickFuera()"
>
  <div
    appFocusTrap
    (escape)="cerrar.emit()"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="sinCabecera() ? null : idTitulo"
    [attr.aria-label]="sinCabecera() ? titulo() : null"
    class="bg-white border border-slate-200 w-full rounded-2xl shadow-xl flex flex-col max-h-[90vh] overflow-hidden"
    [class]="claseAncho()"
  >
    @if (!sinCabecera()) {
      <div class="flex items-start justify-between gap-4 border-b border-slate-100 px-6 py-4 shrink-0">
        <div class="min-w-0">
          <h2 [id]="idTitulo" class="text-lg font-bold text-slate-800">{{ titulo() }}</h2>
          <ng-content select="[modal-subtitulo]" />
        </div>
        <button
          type="button"
          (click)="cerrar.emit()"
          aria-label="Cerrar"
          class="text-slate-400 hover:text-slate-600 p-1 cursor-pointer"
        >
          <span aria-hidden="true">✕</span>
        </button>
      </div>
    }

    <div class="flex-1 min-h-0 overflow-y-auto" [class]="relleno() ? 'p-6 space-y-6' : ''">
      <ng-content />
    </div>

    <div class="shrink-0 border-t border-slate-100 px-6 py-4 empty:hidden"><ng-content select="[modal-pie]" /></div>
  </div>
</div>

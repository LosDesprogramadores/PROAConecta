<nav aria-label="Paginación" class="flex items-center justify-between gap-3 px-5 py-3 border-t border-slate-100 bg-slate-50/50">
  <p class="text-xs text-slate-500" aria-live="polite" role="status">
    Página {{ pagina() }} de {{ totalPaginas() }} · {{ total() }} registros
  </p>
  <div class="flex items-center gap-2">
    <button
      type="button"
      (click)="anterior()"
      [disabled]="!hayAnterior()"
      aria-label="Página anterior"
      class="px-3 py-1.5 rounded-lg border border-slate-200 bg-white text-xs font-semibold text-slate-700 hover:bg-slate-50 transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
      Anterior
    </button>
    <button
      type="button"
      (click)="siguiente()"
      [disabled]="!haySiguiente()"
      aria-label="Página siguiente"
      class="px-3 py-1.5 rounded-lg border border-slate-200 bg-white text-xs font-semibold text-slate-700 hover:bg-slate-50 transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
      Siguiente
    </button>
  </div>
</nav>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROAConecta - En Desarrollo</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-[#f8f9fa] text-slate-800 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white overflow-x-hidden">

    <main class="flex-1 w-full flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-white/95 backdrop-blur-2xl border border-slate-200/80 rounded-3xl p-8 shadow-[0_18px_45px_rgba(15,23,42,0.05)] text-center relative overflow-hidden">
            
            <div class="absolute -top-12 -left-12 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <div class="relative w-20 h-20 mx-auto mb-6 bg-amber-50 border border-amber-200/60 rounded-2xl flex items-center justify-center text-amber-600 shadow-inner animate-float">
             <svg class="w-14 h-14 relative z-10 animate-spin-slow" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
           </div>

            <span class="inline-flex items-center gap-1.5 text-[11px] font-mono tracking-wider uppercase px-3 py-1 rounded-full bg-amber-50 border border-amber-200/60 text-amber-700 font-bold mb-4 shadow-2xs">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-ping"></span>
                Módulo en Construcción
            </span>

            <h1 class="text-xl font-bold tracking-tight text-slate-900 mb-2">
                Estamos mejorando el sistema
            </h1>
            <p class="text-xs text-slate-500 leading-relaxed mb-8 px-2">
                Estamos optimizando los componentes y estructurando nuevas herramientas para brindarte una mejor experiencia.
            </p>

            <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden mb-6 border border-slate-200/50">
                <div class="bg-amber-500 h-full w-2/3 rounded-full animate-pulse"></div>
            </div>

            <p class="text-[11px] text-slate-400 font-medium">
                PROAConecta &copy; 2026
            </p>

        </div>
    </main>

</body>
</html>

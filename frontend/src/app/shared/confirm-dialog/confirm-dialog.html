@if (servicio.pendiente(); as dialogo) {
  <div class="fixed inset-0 z-[100000] flex items-center justify-center p-4">
    <!-- Mouse-only backdrop: keyboard users cancel with Escape or the Cancel button. -->
    <div
      aria-hidden="true"
      data-testid="confirm-fondo"
      class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"
      (click)="dialogo.responder(false)"
    ></div>
    <div
      appFocusTrap
      (escape)="dialogo.responder(false)"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-titulo"
      aria-describedby="confirm-dialog-mensaje"
      class="relative w-full max-w-md rounded-2xl bg-white border border-slate-200 p-6 shadow-xl space-y-4"
    >
      <h2 id="confirm-dialog-titulo" class="text-lg font-bold text-slate-800">
        {{ dialogo.titulo ?? 'Confirmar acción' }}
      </h2>
      <p id="confirm-dialog-mensaje" class="text-sm text-slate-600">{{ dialogo.mensaje }}</p>

      <div class="flex justify-end gap-3 pt-2">
        <button
          type="button"
          data-autofocus
          (click)="dialogo.responder(false)"
          class="px-4 py-2 text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl cursor-pointer"
        >
          {{ dialogo.textoCancelar ?? 'Cancelar' }}
        </button>
        <button
          type="button"
          (click)="dialogo.responder(true)"
          class="px-4 py-2 text-sm font-semibold text-white rounded-xl cursor-pointer"
          [class]="dialogo.peligro === false ? 'bg-primary hover:bg-primary-hover' : 'bg-rose-600 hover:bg-rose-700'"
        >
          {{ dialogo.textoConfirmar ?? 'Confirmar' }}
        </button>
      </div>
    </div>
  </div>
}

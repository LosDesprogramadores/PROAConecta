# Cabecera Connection según el pedido: "upgrade" solo si el cliente pide WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Subida de archivos (entregas, material): coincide con el límite de la API
    client_max_body_size 20m;

    # Cabeceras de seguridad básicas. add_header no se hereda si un location define las suyas,
    # por eso los locations de abajo no declaran add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml font/ttf font/otf;

    root /usr/share/nginx/html;
    index index.html;

    # Archivos con hash en el nombre: cacheables por un año
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        try_files $uri =404;
    }

    # El index nunca se cachea para que un nuevo deploy se vea al recargar
    location = /index.html {
        expires -1;
    }

    # SPA: cualquier ruta del cliente cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos subidos: solo se sirven si el backend los expone
    location ^~ /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket de notificaciones (se autentica con ticket; el backend valida el origen)
    location ^~ /ws/ {
        proxy_pass http://backend:8000/ws/;
        # El ticket viaja en la query string (?ticket=): no se registra en el access log
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Conexión larga: sin esto nginx la corta a los 60 s de silencio
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
